[project]
name = "sentinelclipy"
version = "1.0.0"
description = "A CLI cybersecurity toolkit for authorized defensive workflows."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
	"prompt-toolkit>=3.0.43",
	"rich>=13.7",
	"textual>=0.50",
]

[project.optional-dependencies]
crypto = ["cryptography>=42"]

[project.scripts]
sentinelclipy = "sentinelcli:main"
sentinelcli = "sentinelcli:main"
