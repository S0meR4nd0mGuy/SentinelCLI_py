[project]
name = "sentinelclipy"
version = "1.0.0"
description = "A CLI cybersecurity toolkit for authorized defensive workflows."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
	"prompt-toolkit>=3.0.43",
	"rich>=13.7",
	"textual>=0.50",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
crypto = ["cryptography>=42"]

[project.scripts]
sentinelclipy = "sentinelcli:main"
sentinelcli = "sentinelcli:main"
